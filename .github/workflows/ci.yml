name: CI

on:
  push:
    branches: [master, main, "f**"]
  pull_request:
    branches: [master, main]

jobs:
  validate:
    name: Lint, Typecheck, Unit & E2E Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-project.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key-for-ci-build"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-key-for-ci"
      GEMINI_API_KEY: "placeholder-gemini-api-key"
      DEMO_MODE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run unit test suite (Vitest)
        run: npm run test

      - name: Build Next.js production bundle
        run: npm run build

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
